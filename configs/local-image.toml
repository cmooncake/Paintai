# Real local planner + real local image generation. Critic is still simulated.
data_dir = "../data"

[planner]
provider = "openai_compatible"
base_url = "http://127.0.0.1:18080/v1"
model = "paintai-local"
auth = "none"
prompt_language = "en"
structured_output = "json_schema"
timeout_seconds = 180
[planner.parameters]
temperature = 0.2
max_completion_tokens = 1024

[generator]
provider = "sd_cpp"
model = "sd-turbo-q8_0"
timeout_seconds = 1200
[generator.local_image]
executable = "../data/local-image/runtime/sd-cli.exe"
model_path = "../data/local-image/sd_turbo-f16-q8_0.gguf"
work_dir = "../data/local-image/runs"
width = 512
height = 512
steps = 4
cfg_scale = 1.0
sampling_method = "euler"
scheduler = "discrete"
seed = 42
threads = 8

[critic]
provider = "mock"
