[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paintai"
version = "0.1.0"
description = "Persistent AI painter: create, critique, and archive"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.10,<3", "Pillow>=11,<13", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "fastapi>=0.115,<1"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.scripts]
paintai = "paintai.cli:main"
paintai-api = "paintai.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paintai = ["curriculum/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
